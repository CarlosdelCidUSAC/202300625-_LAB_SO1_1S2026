version: '3.8'

services:
  valkey:
    image: valkey/valkey:latest
    container_name: db_valkey
    ports:
      - "6379:6379"
    networks:
      - red_telemetria

  grafana:
    image: grafana/grafana:latest
    container_name: dashboard_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - valkey
    networks:
      - red_telemetria

networks:
  red_telemetria:
    driver: bridge