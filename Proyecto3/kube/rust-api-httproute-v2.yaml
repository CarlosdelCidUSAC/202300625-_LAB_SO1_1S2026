apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rust-api-httproute
  namespace: default
spec:
  parentRefs:
    - name: military-gateway
      namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grpc-202300625
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /reports
      backendRefs:
        - name: rust-api-service
          port: 80
