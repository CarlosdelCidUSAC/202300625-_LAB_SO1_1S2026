apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloudinit
  labels:
    app: grafana
stringData:
  userdata: |
    #cloud-config
    package_update: true
    packages:
      - wget
      - gnupg
      - apt-transport-https
      - software-properties-common
    write_files:
      - path: /etc/grafana/provisioning/datasources/valkey.yaml
        permissions: '0644'
        owner: root:root
        content: |
          apiVersion: 1
          datasources:
            - name: Valkey
              type: redis-datasource
              access: proxy
              url: valkey-service.default.svc.cluster.local:6379
              isDefault: true
              editable: true
              jsonData:
                client: standalone
                poolSize: 5
                timeout: 10
    runcmd:
      - export DATA_DEV=/dev/disk/by-id/virtio-grafanadata
      - for i in $(seq 1 30); do test -b ${DATA_DEV} && break; sleep 1; done
      - test -b ${DATA_DEV}
      - blkid ${DATA_DEV} || mkfs.ext4 -F ${DATA_DEV}
      - mkdir -p /mnt/grafana-data
      - grep -q "virtio-grafanadata /mnt/grafana-data" /etc/fstab || echo "${DATA_DEV} /mnt/grafana-data ext4 defaults,nofail,x-systemd.device-timeout=30 0 2" >> /etc/fstab
      - mountpoint -q /mnt/grafana-data || mount /mnt/grafana-data
      - mkdir -p /mnt/grafana-data/apt-cache /mnt/grafana-data/usr-share-grafana /mnt/grafana-data/var-lib-grafana /mnt/grafana-data/var-log-grafana
      - mkdir -p /usr/share/grafana /var/lib/grafana /var/log/grafana
      - grep -q "/mnt/grafana-data/usr-share-grafana /usr/share/grafana none bind" /etc/fstab || echo "/mnt/grafana-data/usr-share-grafana /usr/share/grafana none bind 0 0" >> /etc/fstab
      - grep -q "/mnt/grafana-data/var-lib-grafana /var/lib/grafana none bind" /etc/fstab || echo "/mnt/grafana-data/var-lib-grafana /var/lib/grafana none bind 0 0" >> /etc/fstab
      - grep -q "/mnt/grafana-data/var-log-grafana /var/log/grafana none bind" /etc/fstab || echo "/mnt/grafana-data/var-log-grafana /var/log/grafana none bind 0 0" >> /etc/fstab
      - mountpoint -q /usr/share/grafana || mount /usr/share/grafana
      - mountpoint -q /var/lib/grafana || mount /var/lib/grafana
      - mountpoint -q /var/log/grafana || mount /var/log/grafana
      - mkdir -p /etc/apt/keyrings
      - wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
      - chmod 0644 /etc/apt/keyrings/grafana.gpg
      - echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" > /etc/apt/sources.list.d/grafana.list
      - apt-get update
      - mkdir -p /etc/grafana/provisioning/datasources
      - apt-get -o Dir::Cache::archives=/mnt/grafana-data/apt-cache install -y grafana
      - systemctl stop grafana-server || true
      - chown -R grafana:grafana /mnt/grafana-data/var-lib-grafana /var/lib/grafana /mnt/grafana-data/var-log-grafana /var/log/grafana
      - grafana-cli plugins install redis-datasource || true
      - systemctl enable grafana-server
      - systemctl restart grafana-server
