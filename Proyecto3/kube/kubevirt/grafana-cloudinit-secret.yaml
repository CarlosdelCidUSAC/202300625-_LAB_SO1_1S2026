apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloudinit
  labels:
    app: grafana
stringData:
  userdata: |
    #cloud-config
    package_update: true
    packages:
      - wget
      - gnupg
      - apt-transport-https
      - software-properties-common
    write_files:
      - path: /etc/grafana/provisioning/datasources/valkey.yaml
        permissions: '0644'
        owner: root:root
        content: |
          apiVersion: 1
          datasources:
            - name: Valkey
              type: redis-datasource
              access: proxy
              url: valkey-service.default.svc.cluster.local:6379
              isDefault: true
              editable: true
              jsonData:
                client: standalone
                poolSize: 5
                timeout: 10
      - path: /etc/grafana/provisioning/dashboards/project3-provider.yaml
        permissions: '0644'
        owner: root:root
        content: |
          apiVersion: 1
          providers:
            - name: Proyecto3Dashboards
              orgId: 1
              folder: Proyecto3
              type: file
              disableDeletion: false
              editable: true
              updateIntervalSeconds: 30
              options:
                path: /etc/grafana/provisioning/dashboards
      - path: /etc/grafana/provisioning/dashboards/proyecto3-dashboard.json
        permissions: '0644'
        owner: root:root
        content: |
          {
            "id": null,
            "uid": "proyecto3-mumnk8s",
            "title": "Proyecto3 - Dashboard Militar",
            "tags": ["proyecto3", "mumnk8s", "valkey"],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "10s",
            "time": {"from": "now-24h", "to": "now"},
            "panels": [
              {
                "id": 1,
                "type": "stat",
                "title": "1) Maximo general de aviones",
                "datasource": "Valkey",
                "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                "targets": [
                  {
                    "refId": "A",
                    "type": "cli",
                    "query": "EVAL \"local m=-1 for _,k in ipairs(redis.call('HKEYS','mode_warplanes')) do local n=tonumber(k) if n and n>m then m=n end end return m\" 0"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto"}
              },
              {
                "id": 2,
                "type": "stat",
                "title": "2) Minimo general de aviones",
                "datasource": "Valkey",
                "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                "targets": [
                  {
                    "refId": "A",
                    "type": "cli",
                    "query": "EVAL \"local m=999 for _,k in ipairs(redis.call('HKEYS','mode_warplanes')) do local n=tonumber(k) if n and n<m then m=n end end if m==999 then return -1 end return m\" 0"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto"}
              },
              {
                "id": 3,
                "type": "stat",
                "title": "3) Maximo general de barcos",
                "datasource": "Valkey",
                "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
                "targets": [
                  {
                    "refId": "A",
                    "type": "cli",
                    "query": "EVAL \"local m=-1 for _,k in ipairs(redis.call('HKEYS','mode_warships')) do local n=tonumber(k) if n and n>m then m=n end end return m\" 0"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto"}
              },
              {
                "id": 4,
                "type": "stat",
                "title": "4) Minimo general de barcos",
                "datasource": "Valkey",
                "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
                "targets": [
                  {
                    "refId": "A",
                    "type": "cli",
                    "query": "EVAL \"local m=999 for _,k in ipairs(redis.call('HKEYS','mode_warships')) do local n=tonumber(k) if n and n<m then m=n end end if m==999 then return -1 end return m\" 0"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto"}
              },
              {
                "id": 5,
                "type": "bargauge",
                "title": "5) Top paises por aviones",
                "datasource": "Valkey",
                "gridPos": {"h": 6, "w": 12, "x": 0, "y": 4},
                "targets": [
                  {
                    "refId": "A",
                    "type": "command",
                    "command": "zrange",
                    "keyName": "top_countries_warplanes",
                    "min": "0",
                    "max": "-1"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
              },
              {
                "id": 6,
                "type": "bargauge",
                "title": "6) Top paises por barcos",
                "datasource": "Valkey",
                "gridPos": {"h": 6, "w": 12, "x": 12, "y": 4},
                "targets": [
                  {
                    "refId": "A",
                    "type": "command",
                    "command": "zrange",
                    "keyName": "top_countries_warships",
                    "min": "0",
                    "max": "-1"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}}
              },
              {
                "id": 7,
                "type": "stat",
                "title": "7) Moda de aviones",
                "datasource": "Valkey",
                "gridPos": {"h": 4, "w": 6, "x": 0, "y": 10},
                "targets": [
                  {
                    "refId": "A",
                    "type": "cli",
                    "query": "EVAL \"local a=redis.call('HGETALL','mode_warplanes'); local bestV=-1; local bestC=-1; for i=1,#a,2 do local v=tonumber(a[i]); local c=tonumber(a[i+1]); if c and c>bestC then bestC=c; bestV=v; end end return bestV\" 0"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto"}
              },
              {
                "id": 8,
                "type": "stat",
                "title": "8) Moda de barcos",
                "datasource": "Valkey",
                "gridPos": {"h": 4, "w": 6, "x": 6, "y": 10},
                "targets": [
                  {
                    "refId": "A",
                    "type": "cli",
                    "query": "EVAL \"local a=redis.call('HGETALL','mode_warships'); local bestV=-1; local bestC=-1; for i=1,#a,2 do local v=tonumber(a[i]); local c=tonumber(a[i+1]); if c and c>bestC then bestC=c; bestV=v; end end return bestV\" 0"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto"}
              },
              {
                "id": 10,
                "type": "stat",
                "title": "10) Pais asignado (carnet 202300625)",
                "datasource": "Valkey",
                "gridPos": {"h": 4, "w": 6, "x": 12, "y": 10},
                "targets": [
                  {
                    "refId": "A",
                    "type": "cli",
                    "query": "EVAL \"return 'CHN'\" 0"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto"}
              },
              {
                "id": 11,
                "type": "stat",
                "title": "11) Total reportes del pais asignado",
                "datasource": "Valkey",
                "gridPos": {"h": 4, "w": 6, "x": 18, "y": 10},
                "targets": [
                  {
                    "refId": "A",
                    "type": "command",
                    "command": "get",
                    "keyName": "total_reports:CHN"
                  }
                ],
                "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "orientation": "auto"}
              },
              {
                "id": 9,
                "type": "table",
                "title": "9) Serie temporal CHN (registros crudos)",
                "datasource": "Valkey",
                "gridPos": {"h": 8, "w": 24, "x": 0, "y": 14},
                "targets": [
                  {
                    "refId": "A",
                    "type": "cli",
                    "query": "LRANGE timeseries:CHN -200 -1"
                  }
                ],
                "options": {"showHeader": true}
              }
            ]
          }
    runcmd:
      - export DATA_DEV=/dev/disk/by-id/virtio-grafanadata
      - for i in $(seq 1 30); do test -b ${DATA_DEV} && break; sleep 1; done
      - test -b ${DATA_DEV}
      - blkid ${DATA_DEV} || mkfs.ext4 -F ${DATA_DEV}
      - mkdir -p /mnt/grafana-data
      - grep -q "virtio-grafanadata /mnt/grafana-data" /etc/fstab || echo "${DATA_DEV} /mnt/grafana-data ext4 defaults,nofail,x-systemd.device-timeout=30 0 2" >> /etc/fstab
      - mountpoint -q /mnt/grafana-data || mount /mnt/grafana-data
      - mkdir -p /mnt/grafana-data/apt-cache /mnt/grafana-data/usr-share-grafana /mnt/grafana-data/var-lib-grafana /mnt/grafana-data/var-log-grafana
      - mkdir -p /usr/share/grafana /var/lib/grafana /var/log/grafana
      - grep -q "/mnt/grafana-data/usr-share-grafana /usr/share/grafana none bind" /etc/fstab || echo "/mnt/grafana-data/usr-share-grafana /usr/share/grafana none bind 0 0" >> /etc/fstab
      - grep -q "/mnt/grafana-data/var-lib-grafana /var/lib/grafana none bind" /etc/fstab || echo "/mnt/grafana-data/var-lib-grafana /var/lib/grafana none bind 0 0" >> /etc/fstab
      - grep -q "/mnt/grafana-data/var-log-grafana /var/log/grafana none bind" /etc/fstab || echo "/mnt/grafana-data/var-log-grafana /var/log/grafana none bind 0 0" >> /etc/fstab
      - mountpoint -q /usr/share/grafana || mount /usr/share/grafana
      - mountpoint -q /var/lib/grafana || mount /var/lib/grafana
      - mountpoint -q /var/log/grafana || mount /var/log/grafana
      - mkdir -p /etc/apt/keyrings
      - wget -q -O - https://apt.grafana.com/gpg.key | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
      - chmod 0644 /etc/apt/keyrings/grafana.gpg
      - echo "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main" > /etc/apt/sources.list.d/grafana.list
      - apt-get update
      - mkdir -p /etc/grafana/provisioning/datasources
      - mkdir -p /etc/grafana/provisioning/dashboards
      - apt-get -o Dir::Cache::archives=/mnt/grafana-data/apt-cache install -y grafana
      - sed -i "s/^;*admin_user *=.*/admin_user = admin/" /etc/grafana/grafana.ini
      - sed -i "s/^;*admin_password *=.*/admin_password = 1234/" /etc/grafana/grafana.ini
      - systemctl stop grafana-server || true
      - chown -R grafana:grafana /mnt/grafana-data/var-lib-grafana /var/lib/grafana /mnt/grafana-data/var-log-grafana /var/log/grafana
      - grafana-cli plugins install redis-datasource || true
      - systemctl enable grafana-server
      - systemctl restart grafana-server
