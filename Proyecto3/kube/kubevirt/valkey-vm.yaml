apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: valkey-vm
  labels:
    kubevirt.io/vm: valkey-vm
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: valkey-vm
        # Esta etiqueta es crucial para que el Service encuentre la VM
        app: valkey
    spec:
      domain:
        resources:
          requests:
            memory: 1024M
            cpu: 1
        devices:
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: valkey
                  port: 6379
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
                serial: valkeydata
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            # Imagen oficial de Ubuntu 22.04 optimizada para KubeVirt
            image: quay.io/containerdisks/ubuntu:22.04
        - name: datadisk
          persistentVolumeClaim:
            claimName: valkey-data-pvc
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: admin
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
              package_update: true
              packages:
                - docker.io
              runcmd:
                - systemctl enable --now docker
                - export DATA_DEV=/dev/disk/by-id/virtio-valkeydata
                - test -b ${DATA_DEV}
                - blkid ${DATA_DEV} || mkfs.ext4 -F ${DATA_DEV}
                - mkdir -p /var/lib/valkey-data
                - grep -q "virtio-valkeydata" /etc/fstab || echo "${DATA_DEV} /var/lib/valkey-data ext4 defaults,nofail 0 2" >> /etc/fstab
                - mount -a
                - chmod 777 /var/lib/valkey-data
                - docker rm -f valkey-server || true
                - docker run -d --name valkey-server -p 6379:6379 --restart unless-stopped -v /var/lib/valkey-data:/data valkey/valkey:latest valkey-server --appendonly yes
