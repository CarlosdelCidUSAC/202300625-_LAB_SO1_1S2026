apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: valkey-vm
  labels:
    kubevirt.io/vm: valkey-vm
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: valkey-vm
        # Esta etiqueta es crucial para que el Service encuentre la VM
        app: valkey
    spec:
      domain:
        resources:
          requests:
            memory: 1024M
            cpu: 1
        devices:
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: valkey
                  port: 6379
          disks:
            - name: containerdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: datadisk
              disk:
                bus: virtio
              serial: valkeydata
      networks:
        - name: default
          pod: {}
      volumes:
        - name: containerdisk
          containerDisk:
            # Imagen oficial de Ubuntu 22.04 optimizada para KubeVirt
            image: quay.io/containerdisks/ubuntu:22.04
        - name: datadisk
          persistentVolumeClaim:
            claimName: valkey-data-pvc
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              package_update: true
              packages:
                - redis-server
              runcmd:
                - export DATA_DEV=/dev/disk/by-id/virtio-valkeydata
                - for i in $(seq 1 30); do test -b ${DATA_DEV} && break; sleep 1; done
                - test -b ${DATA_DEV}
                - blkid ${DATA_DEV} || mkfs.ext4 -F ${DATA_DEV}
                - mkdir -p /mnt/valkey-data
                - grep -q "virtio-valkeydata /mnt/valkey-data" /etc/fstab || echo "${DATA_DEV} /mnt/valkey-data ext4 defaults,nofail,x-systemd.device-timeout=30 0 2" >> /etc/fstab
                - mountpoint -q /mnt/valkey-data || mount /mnt/valkey-data
                - systemctl stop redis-server || true
                - mkdir -p /mnt/valkey-data/redis
                - test -f /mnt/valkey-data/redis/.migrated || (cp -a /var/lib/redis/. /mnt/valkey-data/redis/ || true)
                - touch /mnt/valkey-data/redis/.migrated
                - mkdir -p /var/lib/redis
                - grep -q "/mnt/valkey-data/redis /var/lib/redis none bind" /etc/fstab || echo "/mnt/valkey-data/redis /var/lib/redis none bind 0 0" >> /etc/fstab
                - mountpoint -q /var/lib/redis || mount /var/lib/redis
                - chown -R redis:redis /mnt/valkey-data/redis /var/lib/redis
                - sed -i 's/^bind .*/bind 0.0.0.0/' /etc/redis/redis.conf
                - sed -i 's/^protected-mode .*/protected-mode no/' /etc/redis/redis.conf
                - sed -i 's/^appendonly .*/appendonly yes/' /etc/redis/redis.conf
                - systemctl enable redis-server
                - systemctl restart redis-server
