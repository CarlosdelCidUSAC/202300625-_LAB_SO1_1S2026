# Servicio para comunicación interna (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: grpc-server-service
  namespace: default
spec:
  selector:
    app: go-server
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051

---
# Deployment 2: gRPC Server + RabbitMQ Writer (1 réplica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-server-deployment-2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-server
      deployment: writer-2
  template:
    metadata:
      labels:
        app: go-server
        deployment: writer-2
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "go-server-dapr"
        dapr.io/app-port: "8082"
        dapr.io/app-protocol: "http"
    spec:
      containers:
        - name: go-server
          image: 35.237.182.41:5000/go-server:v1
          ports:
            - containerPort: 50051
            - containerPort: 8082
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq-service.default.svc.cluster.local:5672/"
            - name: RABBITMQ_QUEUE
              value: "war_reports_queue"
            - name: GRPC_PORT
              value: "50051"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 15
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

