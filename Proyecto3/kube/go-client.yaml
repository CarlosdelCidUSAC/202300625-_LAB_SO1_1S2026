apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-client-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-client
  template:
    metadata:
      labels:
        app: go-client
    spec:
      containers:
        - name: go-client
          image: <IP_VM_ZOT>:5000/go-client:v1
          ports:
            - containerPort: 8081
          env:
            - name: GRPC_SERVER_ADDR
              value: "grpc-server-service:50051"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
