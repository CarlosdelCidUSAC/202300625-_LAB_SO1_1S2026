apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rust-api
  template:
    metadata:
      labels:
        app: rust-api
    spec:
      containers:
        - name: rust-api
          image: gcr.io/proyecto3-202300625/rust-api:v2
          env:
            - name: GO_SERVICE_URL
              value: http://go-client-service.default.svc.cluster.local:8081/api/reports
            - name: GO_DAPR_SERVICE_URL
              value: http://go-client-service.default.svc.cluster.local:8081/dapr/reports
          ports:
            - containerPort: 8080
          readinessProbe: # Requisito del HPA y Probes [Paso anterior]
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"
